[project]
name = "gita-ingestion"
version = "0.1.0"
description = "Content ingestion, validation and canonical change logging"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0.36", "pydantic>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gita_ingestion*"]
