[project]
name = "gita-embeddings"
version = "0.1.0"
description = "Open-source multilingual embeddings with a pluggable backend"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gita_embeddings*"]
