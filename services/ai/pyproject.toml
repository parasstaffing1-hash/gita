[project]
name = "gita-ai"
version = "0.1.0"
description = "Provider-agnostic LLM abstraction and grounded answer pipeline"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gita_ai*"]
