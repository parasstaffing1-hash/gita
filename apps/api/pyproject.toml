[project]
name = "gita-api"
version = "0.1.0"
description = "Bhagavad Gita platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary,pool]>=3.2.3",
    "pgvector>=0.3.6",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "boto3>=1.35.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.18.0",
    "posthog>=3.7.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose",
]
embeddings = [
    "sentence-transformers>=3.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gita_api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# B008   - FastAPI's Depends() in defaults is the documented pattern.
# RUF012 - SQLAlchemy __table_args__ tuples are class-level by design.
# RUF001/2/3 - this codebase contains Devanagari, IAST diacritics and en
#              dashes on purpose; "ambiguous character" is the point.
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
